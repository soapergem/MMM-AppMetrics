<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMM-AppMetrics Preview</title>
    <link rel="stylesheet" href="MMM-AppMetrics.css">
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 40px 20px;
            font-family: "Roboto Condensed", Arial, sans-serif;
        }

        .preview-title {
            color: #fff;
            text-align: center;
            margin: 0 0 24px;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
        }

        .preview-stage {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 40px;
        }

        .preview-panel-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }
    </style>

    <!-- Bundled charting library, same file the module loads at runtime -->
    <script src="vendor/chart.umd.min.js"></script>

    <!-- Minimal MagicMirror stubs so MMM-AppMetrics.js runs in a plain browser -->
    <script>
        var __module = null;
        var Module = { register: function(name, obj) { __module = obj; } };
        var Log = { error: function(){ console.error.apply(console, arguments); },
                    warn:  function(){ console.warn.apply(console, arguments); } };
    </script>
    <script src="MMM-AppMetrics.js"></script>
</head>
<body>
    <h1 class="preview-title">MMM-AppMetrics Preview (mock data)</h1>
    <div class="preview-stage" id="stage"></div>

    <script>
        // ---- Build 30 days of plausible mock metrics -----------------------
        // Local time, matching node_helper's dateRange -- toISOString() would
        // render the UTC date and shift every label a day forward in the evening.
        function isoDate(daysAgo) {
            var d = new Date();
            d.setDate(d.getDate() - daysAgo);
            var pad = function(n) { return String(n).padStart(2, "0"); };
            return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        }

        function dailyCounts(base, jitter) {
            var out = [];
            for (var i = 29; i >= 0; i--) {
                var count = Math.max(0, Math.round(base + (Math.random() - 0.5) * jitter));
                out.push({ date: isoDate(i), count: count });
            }
            return out;
        }

        function dailyRevenue(base, jitter) {
            var out = [];
            for (var i = 29; i >= 0; i--) {
                var rev = Math.max(0, base + (Math.random() - 0.5) * jitter);
                out.push({ date: isoDate(i), revenue: rev.toFixed(2), currency: "USD", native: [] });
            }
            return out;
        }

        // Record a purchase as having been made in a foreign currency, the way
        // the API's `native` array does. `daysAgo` counts back from today.
        function stampNative(daily, daysAgo, natives) {
            daily[daily.length - 1 - daysAgo].native = natives;
        }

        function sum(arr, field) {
            return arr.reduce(function(s, e) { return s + parseFloat(e[field]); }, 0);
        }

        var iosDl = dailyCounts(120, 60), andDl = dailyCounts(80, 50);
        var iosIap = dailyRevenue(1.1, 1.6), andIap = dailyRevenue(0.6, 1.0);

        // A handful of foreign-currency purchases, to exercise the markers:
        // two mapped currencies, one unmapped (AUD falls back to its code), one
        // day carrying two currencies at once, and one on the last day to check
        // the marker doesn't spill past the right-hand axis.
        stampNative(iosIap, 3, [{ currency: "CAD", amount: "2.79" }]);
        stampNative(iosIap, 11, [{ currency: "EUR", amount: "1.74" }]);
        stampNative(iosIap, 18, [{ currency: "AUD", amount: "3.10" }]);
        stampNative(iosIap, 24, [{ currency: "CAD", amount: "1.40" },
                                 { currency: "GBP", amount: "0.80" }]);
        stampNative(andIap, 0, [{ currency: "JPY", amount: "150" }]);
        // Ad revenue arrives in cents-per-day, orders of magnitude below IAP —
        // this is the scale mismatch the dual y axis exists to handle.
        var andAd = dailyRevenue(0.05, 0.08);

        var mockData = {
            range: { start_date: isoDate(29), end_date: isoDate(0) },
            errors: [],
            downloads: {
                platforms: [
                    { platform: "ios", total_downloads: sum(iosDl, "count"), daily: iosDl },
                    { platform: "android", total_downloads: sum(andDl, "count"), daily: andDl }
                ]
            },
            iapRevenue: {
                platforms: [
                    { platform: "ios", total_revenue: sum(iosIap, "revenue").toFixed(2), currency: "USD", daily: iosIap },
                    { platform: "android", total_revenue: sum(andIap, "revenue").toFixed(2), currency: "USD", daily: andIap }
                ]
            },
            adRevenue: {
                platforms: [
                    { platform: "android", total_revenue: sum(andAd, "revenue").toFixed(2), currency: "USD", daily: andAd }
                ]
            }
        };

        // ---- Drive the real module object ---------------------------------
        // State is fed through the module's own notification handler rather
        // than assigned directly, so the preview exercises the same merge path
        // the running widget takes.
        var seq = 0;
        function makeModule() {
            var mod = Object.create(__module);
            mod.config = Object.assign({}, __module.defaults);
            mod.identifier = "preview" + (++seq);
            mod.updateDom = function() {};
            mod.sendSocketNotification = function() {};
            mod.start();
            return mod;
        }

        var stage = document.getElementById("stage");

        function addPanel(label, mod) {
            var panel = document.createElement("div");
            var caption = document.createElement("div");
            caption.className = "preview-panel-label";
            caption.textContent = label;
            panel.appendChild(caption);
            panel.appendChild(mod.getDom());
            stage.appendChild(panel);
        }

        // Every metric fetched successfully.
        var fresh = makeModule();
        fresh.socketNotificationReceived("APP_DATA", mockData);
        addPanel("All metrics fresh", fresh);

        // The poll lost IAP revenue. Its last known value is held over —
        // dimmed, and labelled with its age — instead of disappearing until
        // the next poll an hour later.
        var held = makeModule();
        held.socketNotificationReceived("APP_DATA", mockData);
        held.metrics.iapRevenue.at = new Date(Date.now() - 2 * 3600 * 1000);
        held.socketNotificationReceived("APP_DATA", {
            range: mockData.range,
            errors: ["iapRevenue: Request timeout for /metrics/iap-revenue"],
            downloads: mockData.downloads,
            adRevenue: mockData.adRevenue
        });
        addPanel("IAP revenue held over", held);
    </script>
</body>
</html>
